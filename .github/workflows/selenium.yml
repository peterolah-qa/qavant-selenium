name: Selenium Tests (Java)

# Synthetic monitor: runs the Selenium/TestNG suite against the live site.
# status.json is generated and attached to the run artifacts — it is NOT
# pushed back to main, because nothing consumes it (see ADR 0005).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'   # daily, after the Playwright (6:00) and Newman (6:30) suites
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest   # browser comes from the Grid container, not the runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Grid comes from the same docker-compose.yml used locally, so the
      # pinned browser version has a single source of truth (see ADR 0002).
      - name: Start Selenium Grid
        run: docker compose up -d --wait

      - name: Run Selenium suite
        id: tests
        continue-on-error: true   # publish status even when tests fail
        run: mvn -B test
        env:
          QAVANT_BASE_URL: ${{ vars.BASE_URL || 'https://qavant.dev' }}
          SELENIUM_REMOTE_URL: http://localhost:4444

      - name: Grid logs on failure
        if: steps.tests.outcome == 'failure'
        run: docker compose logs --no-color chrome | tail -100

      - name: Generate status.json
        if: always()
        run: node scripts/report-status.mjs

      # ---------- Allure report -> GitHub Pages (published on every run, even red) ----------
      - name: Load Allure history from gh-pages
        uses: actions/checkout@v4
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report (with history)
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ ! -d target/allure-results ]; then
            echo "no allure-results found (tests did not run?) — skipping report build"
            exit 0
          fi
          npm install -g allure-commandline@2.32.0
          # carry the trend history over from the previously published report
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history target/allure-results/history
          fi
          allure generate target/allure-results -o allure-report --clean

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && github.event_name != 'pull_request' && hashFiles('allure-report/index.html') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            status.json
          retention-days: 14

      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Selenium tests failed — failing the build."
          exit 1
