name: Selenium Tests (Java)

# Quality gate + publisher: runs the Selenium/TestNG suite against the live
# site and writes a status.json (test count, pass rate, run count) back to
# main. status.json pushes are path-ignored so they never re-trigger this.
on:
  push:
    branches: [main]
    paths-ignore: ['status.json']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'   # daily, after the Playwright (6:00) and Newman (6:30) suites
  workflow_dispatch:

permissions:
  contents: write   # needed to commit status.json back to the repo

jobs:
  test:
    runs-on: ubuntu-latest   # browser comes from the Grid container, not the runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Grid comes from the same docker-compose.yml used locally, so the
      # pinned browser version has a single source of truth (see ADR 0002).
      - name: Start Selenium Grid
        run: docker compose up -d --wait

      - name: Run Selenium suite
        id: tests
        continue-on-error: true   # publish status even when tests fail
        run: mvn -B test
        env:
          QAVANT_BASE_URL: ${{ vars.BASE_URL || 'https://qavant.dev' }}
          SELENIUM_REMOTE_URL: http://localhost:4444

      - name: Grid logs on failure
        if: steps.tests.outcome == 'failure'
        run: docker compose logs --no-color chrome | tail -100

      - name: Generate